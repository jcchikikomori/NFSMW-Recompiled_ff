name: Linux AppImage x86_64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "launcher-linux/**"
      - "packaging/**"
      - ".github/workflows/linux-appimage-x86_64.yml"

permissions:
  contents: read

jobs:
  build-appimage-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      DEBIAN_FRONTEND: noninteractive
      CMAKE_GENERATOR: Ninja

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install deps
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gpg ca-certificates

          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-20 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-toolchain-noble-20.list

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            clang-20 \
            lld-20 \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-svg-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            git \
            curl \
            ca-certificates \
            file \
            desktop-file-utils

      - name: Add Qt to PATH
        shell: bash
        run: |
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"

      - name: Download x86_64 AppImage tooling
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/bin"

          curl -L \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o "$HOME/.local/bin/linuxdeploy"
          curl -L \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -o "$HOME/.local/bin/linuxdeploy-plugin-qt"
          curl -L \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$HOME/.local/bin/appimagetool"

          chmod +x "$HOME/.local/bin/linuxdeploy" \
                   "$HOME/.local/bin/linuxdeploy-plugin-qt" \
                   "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone SDK
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/rexglue/rexglue-sdk.git ../rexglue-sdk

      - name: Configure x86_64 build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S app \
                -B app/build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=clang-20 \
                -DCMAKE_CXX_COMPILER=clang++-20 \
                -DNFSMW_BUILD_LAUNCHER=ON

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build app/build --parallel

      - name: Package x86_64 AppImage
        shell: bash
        run: |
          set -euxo pipefail

          # Keep the repo's logic but make it arch-aware.
          # The existing script is ARM64-specific and will reject x86_64.
          export ARCH="$(uname -m)"
          export OUTPUT="${PWD}/app/build/NFSMW-${ARCH}.AppImage"

          # You will need a x86_64 packaging script here, because the shipped
          # build-appimage-arm64.sh hard-codes aarch64 and build-arm64.
          # Minimal workaround:
          #   - copy the script
          #   - replace "aarch64" with "${ARCH}"
          #   - replace "build-arm64" with "build-${ARCH}"
          #   - remove the hard ARM64 check
          #   - use x86_64 linuxdeploy/appimagetool
          #
          # Then run:
          # ./packaging/appimage/build-appimage-x86_64.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfsmw-linux-x86_64-appimage
          path: app/build/NFSMW-*.AppImage
          if-no-files-found: error
